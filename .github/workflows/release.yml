# Publishes each new version to Firefox Add-ons (AMO) and the Chrome Web Store.
#
# Runs when package.json changes on main (a version bump) or by hand
# (Actions → Release → Run workflow; "chrome" sends an already released version to Chrome
# only, for when its upload failed, e.g. while the item was still in review). A version is released once: the run tags it
# v<version> and makes a GitHub release with both zips attached (the files to upload to a
# store by hand), and later runs skip versions that already have a tag. Each store is
# skipped while its secrets are missing (see store/PUBLISHING.md, "Automatic releases").
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      store:
        description: Which store
        type: choice
        options: [all, chrome]
        default: all

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.store }}" != chrome ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.v.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build and check
        if: steps.v.outputs.skip != 'true'
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run lint:ext
          node scripts/release-notes.mjs "${{ steps.v.outputs.version }}" > amo-metadata.json

      - name: Firefox Add-ons
        if: steps.v.outputs.skip != 'true' && env.AMO_JWT_ISSUER != '' && inputs.store != 'chrome'
        run: >
          npx web-ext sign --source-dir dist --artifacts-dir release
          --channel listed --amo-metadata amo-metadata.json --approval-timeout 0
          --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"

      # Chrome refuses an upload while an earlier version is in review: the run goes on, and
      # "Run workflow" with store = chrome sends it later.
      - name: Chrome Web Store
        continue-on-error: true
        if: steps.v.outputs.skip != 'true' && (env.CWS_SERVICE_ACCOUNT != '' || env.CWS_REFRESH_TOKEN != '')
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npm run zip:chrome
          zip="release/chinese_brain-${{ steps.v.outputs.version }}-chrome.zip"
          # A service account (CWS_SERVICE_ACCOUNT) needs no consent screen and never expires;
          # the older OAuth client + refresh token still works as a fallback.
          if [ -n "$CWS_SERVICE_ACCOUNT" ]; then
            node scripts/cws-publish.mjs "$zip"
          else
            npx --yes chrome-webstore-upload-cli@4.0.2 --source "$zip"
          fi

      - name: Tag the release
        if: steps.v.outputs.skip != 'true' && inputs.store != 'chrome' && (env.AMO_JWT_ISSUER != '' || env.CWS_REFRESH_TOKEN != '' || env.CWS_SERVICE_ACCOUNT != '')
        run: |
          git tag "v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"

      # The two zips, downloadable from the repository's Releases page: the Chrome one is the
      # file to upload in the Chrome Web Store dashboard when that is done by hand.
      - name: GitHub release
        if: steps.v.outputs.skip != 'true' && inputs.store != 'chrome'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          npm run zip
          npm run zip:chrome
          node scripts/release-notes.mjs "$v" --text > release-notes.txt
          gh release create "v$v" "release/chinese_brain-$v.zip" "release/chinese_brain-$v-chrome.zip" --target "${{ github.sha }}" --title "Chinese Brain $v" --notes-file release-notes.txt
