<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word list · Chinese Brain</title>
<link rel="icon" href="icons/icon.svg">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<header class="sign"><div class="in">
  <div class="name">中文腦<small>Chinese Brain</small></div>
  <nav><a href="vocab.html" aria-current="page">Words</a><a href="options.html">Settings</a></nav>
</div></header>
<main>
  <div class="bar">
    <div class="seg4" id="filter" role="group" aria-label="Show"></div>
    <input type="search" id="q" placeholder="Search words, pinyin, meanings" aria-label="Search">
    <select id="sort" aria-label="Sort">
      <option value="updated">Recently changed</option>
      <option value="added">Recently added</option>
      <option value="looks">Most looked up</option>
    </select>
    <a class="jump" href="#export">Export</a>
  </div>
  <div class="cards" id="rows"></div>
  <div class="more"><span class="muted small" id="more"></span><button id="showMore" hidden>Show more</button></div>

  <h2 id="export">Export &amp; backup</h2>
  <div class="tools">
    <div class="tool">
      <h3>Export for Claude</h3>
      <p id="lastExport"></p>
      <div class="actions">
        <button class="primary" id="exportNew" title="Words whose status you changed, plus saved sentences (TSV)">Download new</button>
        <button id="copyNew">Copy</button>
        <button class="link" id="exportAll">Everything</button>
        <span class="ok" id="copyOk"></span>
      </div>
    </div>
    <div class="tool">
      <h3 id="import">Import word list</h3>
      <p>known-words.txt: <code>word⇥K|L|F</code></p>
      <textarea id="knownText" rows="3" placeholder="Paste the list, or choose the file"></textarea>
      <div class="actions">
        <label class="filebtn">Choose file<input type="file" id="knownFile" accept=".txt,.tsv,.csv"></label>
        <button class="primary" id="knownGo">Import</button>
        <span class="ok" id="knownOk"></span>
      </div>
    </div>
    <div class="tool">
      <h3>Backup</h3>
      <p>Everything, in one file. For moving or reinstalling.</p>
      <div class="actions">
        <button id="backup">Download</button>
        <label class="filebtn">Restore…<input type="file" id="restore" accept=".json"></label>
      </div>
    </div>
  </div>
</main>
<script src="vocab.js"></script>
<!-- Hover lookup on this page too (content scripts do not run on extension pages). -->
<script src="content.js"></script>
</body>
</html>
