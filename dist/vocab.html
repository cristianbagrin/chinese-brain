<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word list · Chinese Brain</title>
<link rel="icon" href="icons/icon.svg">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<header class="plate"><div class="in">
  <a class="brand" href="vocab.html"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M45.01 21.65 43.44 43.58 20.9 44.2 19.61 23ZM21.07 48.29 47.25 47.5Q48.09 47.45 48.74 47.34Q49.38 47.22 49.38 46.44Q49.38 45.99 48.99 45.32Q48.6 44.64 47.81 43.64L49.66 21.32Q49.72 21.09 49.86 20.79Q50 20.48 50 20.08Q50 19.3 49.05 18.46Q48.09 17.62 46.8 17.62H46.47L19.21 19.02Q16.02 17.62 15.01 17.62Q14 17.62 14 18.51Q14 19.02 14.39 19.69Q14.73 20.36 14.95 21.35Q15.18 22.33 15.23 23.17L16.52 45.49Q16.58 45.77 16.58 46.07Q16.58 46.38 16.58 46.66Q16.58 47.39 16.52 47.93Q16.47 48.46 16.36 49.07Q16.36 49.13 16.33 49.21Q16.3 49.3 16.3 49.47Q16.3 50.53 17.25 51.15Q18.21 51.77 19.1 52.1L20 52.38Q21.23 52.38 21.23 50.64V50.36Z" fill="#fbf1de"/><g transform="rotate(4 32 34)"><path d="M27.2 4h4.6l-1.0999999999999999 56h-2.4z" fill="#1c1a1a"/><path d="M27.2 4h4.6l-.15 9h-4.3z" fill="#e9b44c"/></g><g transform="rotate(11 32 34)"><path d="M32.7 4h4.6l-1.0999999999999999 56h-2.4z" fill="#1c1a1a"/><path d="M32.7 4h4.6l-.15 9h-4.3z" fill="#e9b44c"/></g></svg><span class="name" lang="zh-Hant">中文腦</span><span class="en">Chinese Brain</span></a>
  <nav><a href="vocab.html" aria-current="page">Words</a><a href="options.html">Settings</a></nav>
</div></header>
<main>
  <div class="bar">
    <div class="filter" id="filter" role="group" aria-label="Show"></div>
    <input type="search" id="q" placeholder="Search words" aria-label="Search words, pinyin or meanings">
    <select id="sort" aria-label="Sort">
      <option value="updated">Recently changed</option>
      <option value="added">Recently added</option>
      <option value="looks">Most looked up</option>
    </select>
    <a class="jump" href="#export">Export</a>
  </div>
  <div class="words" id="rows"></div>
  <div class="more"><span class="muted small" id="more"></span><button id="showMore" hidden>Show more</button></div>

  <h2 id="export">Export &amp; backup</h2>
  <div class="tools">
    <div class="tool">
      <h3>Export for Claude</h3>
      <p id="lastExport"></p>
      <div class="actions">
        <button class="primary" id="exportNew" title="Words whose status you changed, plus saved sentences (TSV)">Download new</button>
        <button id="copyNew">Copy</button>
        <button class="link" id="exportAll">Everything</button>
        <span class="ok" id="copyOk"></span>
      </div>
    </div>
    <div class="tool">
      <h3 id="import">Import word list</h3>
      <p>known-words.txt: <code>word⇥K|L|F</code></p>
      <textarea id="knownText" rows="3" placeholder="Paste the list, or choose the file"></textarea>
      <div class="actions">
        <label class="filebtn">Choose file<input type="file" id="knownFile" accept=".txt,.tsv,.csv"></label>
        <button id="knownGo">Import</button>
        <span class="ok" id="knownOk"></span>
      </div>
    </div>
    <div class="tool">
      <h3>Backup</h3>
      <p>Everything, in one file. For moving or reinstalling.</p>
      <div class="actions">
        <button id="backup">Download</button>
        <label class="filebtn">Restore…<input type="file" id="restore" accept=".json"></label>
      </div>
    </div>
  </div>
</main>
<script src="vocab.js"></script>
<!-- Hover lookup on this page too (content scripts do not run on extension pages). -->
<script src="content.js"></script>
</body>
</html>
