<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="pages.css">
<style>
  body { width: 320px; background: var(--paper); font-size: 14px; }
  .wrap { padding: 12px 14px 12px; }
  .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 4px; }
  .count { min-width: 0; padding: 5px 8px 4px; border-top-width: 3px; border-radius: 8px; background: var(--ground); border-left: 0; border-right: 0; border-bottom: 0; }
  .count b { font-size: 18px; }
  .count span { font-size: 11.5px; }
  .group { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--rule); }
  .group h3 { margin: 0 0 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 30px; }
  .row > span { flex: 1; }
  .row .sub { display: block; font-size: 12px; color: var(--ink2); }
  .row[hidden] { display: none; }

  /* Switches */
  .sw { position: relative; flex: none; width: 32px; height: 18px; cursor: pointer; }
  .sw input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .sw i { position: absolute; inset: 0; border-radius: 9px; background: #c9cbe0; transition: background 0.15s; pointer-events: none; }
  .sw i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .sw input:checked + i { background: var(--known); }
  .sw input:checked + i::after { transform: translateX(14px); }
  .sw input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Segmented choices */
  .seg { display: inline-flex; background: var(--ground); border: 0; border-radius: 7px; padding: 2px; flex: none; }
  .seg button { border: 0; border-radius: 5px; padding: 2px 9px; font-size: 12.5px; background: transparent; color: var(--ink2); }
  .seg button[aria-pressed='true'] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(27,29,58,.15); }
  .seg button:hover { border-color: transparent; color: var(--ink); }

  .stats { font-size: 12px; color: var(--ink2); margin: -2px 0 2px; }
  .links { display: flex; gap: 8px; margin-top: 12px; }
  .links a { flex: 1; text-align: center; text-decoration: none; padding: 6px 0; border-radius: 8px; background: var(--ground); color: var(--ink); font-size: 13px; }
  .links a:hover { background: var(--rule); }
</style>
</head>
<body>
<div class="wrap">
  <div class="counts" id="counts"></div>

  <div class="group">
    <h3>Lookup</h3>
    <div class="row"><span>Show the card</span>
      <div class="seg" data-setting="hoverMode"><button data-v="hover">hover</button><button data-v="shift">Shift</button><button data-v="off">off</button></div>
    </div>
    <div class="row" id="siteLine" hidden><span>Lookup on <b id="host"></b></span><label class="sw"><input type="checkbox" id="siteOn"><i></i></label></div>
    <div class="row"><span>Pinyin <kbd>P</kbd></span><label class="sw"><input type="checkbox" data-setting="pinyin"><i></i></label></div>
    <div class="row"><span>Card size</span>
      <div class="seg" data-setting="cardSize"><button data-v="normal">normal</button><button data-v="large">large</button></div>
    </div>
    <div class="row"><span>Color words on pages</span><label class="sw"><input type="checkbox" data-setting="pageColors"><i></i></label></div>
    <div class="stats" id="pageStats"></div>
    <div class="row"><span>Stamp sounds</span><label class="sw"><input type="checkbox" data-setting="sounds"><i></i></label></div>
  </div>

  <div class="group">
    <h3>Voice</h3>
    <div class="row"><span>Voice</span>
      <div class="seg" data-setting="voice"><button data-v="google">Google</button><button data-v="system">system</button><button data-v="azure">Azure</button></div>
    </div>
  </div>

  <div class="group">
    <h3>YouTube</h3>
    <div class="row"><span>Chinese Brain subtitles</span><label class="sw"><input type="checkbox" data-setting="ytEnabled"><i></i></label></div>
    <div class="row"><span>English line <kbd>X</kbd></span>
      <div class="seg" data-setting="translation"><button data-v="show">show</button><button data-v="blur">blur</button><button data-v="hide">hide</button></div>
    </div>
    <div class="row"><span>Pause on hover</span><label class="sw"><input type="checkbox" data-setting="pauseOnHover"><i></i></label></div>
    <div class="row"><span>Subtitle band</span>
      <div class="seg" data-setting="subStyle"><button data-v="light">light</button><button data-v="dark">dark</button></div>
    </div>
  </div>

  <div class="links"><a href="vocab.html" target="_blank">Word list &amp; export</a><a href="options.html" target="_blank">All settings</a></div>
</div>
<script src="action.js"></script>
</body>
</html>
