<!doctype html>
<html><head><meta charset="utf-8"><title>颱風夜市 mock - YouTube</title>
<style>
  body { margin: 0; background: #0f0f0f; font-family: sans-serif; }
  #movie_player { position: relative; width: 960px; height: 540px; margin: 20px auto; background: #000; overflow: hidden; }
  #movie_player video { width: 100%; height: 100%; }
  .ytp-caption-window-container { position: absolute; bottom: 40px; width: 100%; text-align: center; color: #ff0; font-size: 24px; }
  .ytp-chrome-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 48px; background: rgba(0,0,0,.5); z-index: 59; }
</style></head>
<body>
<div id="movie_player" class="html5-video-player">
  <video src="/v.webm" muted loop playsinline></video>
  <div class="ytp-caption-window-container"><span class="ytp-caption-segment">NATIVE CAPTION (should be hidden)</span></div>
  <div class="ytp-chrome-bottom"><div class="ytp-right-controls" style="position:absolute;right:8px;top:0;height:48px;display:flex;align-items:center"><button class="ytp-button" style="width:40px;height:40px;background:#333;border:0;color:#fff">⚙</button></div></div>
</div>
<script>
  const p = document.getElementById('movie_player');
  const tracks = [
    { languageCode: 'zh-TW', kind: '', name: { simpleText: '中文（台灣）' }, vssId: '.zh-TW', isTranslatable: true },
    { languageCode: 'zh', kind: 'asr', name: { simpleText: '中文（自動產生）' }, vssId: 'a.zh', isTranslatable: true },
  ];
  if (location.search.includes('notracks')) tracks.length = 0;
  const vid = new URLSearchParams(location.search).get('v');
  p.getPlayerResponse = () => ({ videoDetails: { videoId: vid }, captions: { playerCaptionsTracklistRenderer: { captionTracks: tracks } } });
  p.loadModule = () => {};
  p.getOption = (m, k) => (k === 'tracklist' ? tracks.map((t) => ({ languageCode: t.languageCode, kind: t.kind, languageName: t.name.simpleText })) : null);
  const noFetch = location.search.includes('nofetch');
  if (noFetch) {
    // Simulate a capture failure: only the on-screen caption text changes.
    const lines = ['大家好，歡迎來到我的頻道', '今天我們要去夜市吃滷肉飯', '颱風要來了，記得多買一點泡麵'];
    let i = 0;
    setInterval(() => (document.querySelector('.ytp-caption-segment').textContent = lines[i++ % lines.length]), 2000);
  }
  p.setOption = (m, k, t) => {
    if (noFetch) return;
    window.__setOption = (window.__setOption || []).concat([JSON.stringify(t)]);
    const tl = t.translationLanguage ? '&tlang=' + t.translationLanguage.languageCode : '';
    fetch('/api/timedtext?v=TEST&lang=' + t.languageCode + (t.kind ? '&kind=' + t.kind : '') + tl + '&fmt=json3&pot=xyz');
  };
  document.querySelector('video').play().catch(() => {});
</script>
</body></html>
