<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="pages.css">
<style>
  /*
   * The whole menu is the logo: a red tile with the paper-white settings inside it. Firefox paints
   * the panel (its rim and arrow) in the body's color, so the body is red: a paper body left a
   * pale rim around the red band.
   */
  html, body { background: var(--red); }
  body { width: 320px; padding: 0 5px 5px; font-size: 14px; }
  /* The band: the logo's red tile, with your three piles of words on it. */
  .band { display: flex; align-items: center; gap: 4px; padding: 8px 5px 8px 1px; background: var(--red); color: #fff; }
  .band .mark { width: 34px; height: 34px; flex: none; margin-right: 2px; }
  .band a { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; padding: 5px 6px; border-radius: 8px; color: inherit; text-decoration: none; }
  .band a:hover { background: rgba(0, 0, 0, 0.14); }
  .band a:focus-visible { outline-color: #fff; outline-offset: -2px; }
  .band .seal { width: 24px; height: 24px; border: 0; background: var(--paper); font-size: 14px; }
  .band b { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .wrap { padding: 6px 12px 10px; border-radius: 9px; background: var(--paper); }
  .group { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--rule); }
  .group:first-child { margin-top: 0; border-top: 0; }
  .group h3 { margin: 0 0 2px; font-size: 12.5px; font-weight: 650; color: var(--ink2); }
  /* Compact rows: everything fits in the popup without scrolling (Firefox caps it near 600px). */
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 30px; padding: 2px 0; border: 0; }
  .row > span { flex: 1; }
  .row .sub { display: block; font-size: 12px; color: var(--ink2); }
  .row[hidden] { display: none; }

  /* Switches */
  .sw { position: relative; flex: none; width: 32px; height: 18px; cursor: pointer; }
  .sw input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .sw i { position: absolute; inset: 0; border-radius: 9px; background: #d6cec5; transition: background 0.15s; pointer-events: none; }
  .sw i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .sw input:checked + i { background: var(--known); }
  .sw input:checked + i::after { transform: translateX(14px); }
  .sw input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Segmented choices */
  .seg { display: inline-flex; background: var(--ground); border: 0; border-radius: 7px; padding: 2px; flex: none; }
  .seg button { border: 0; border-radius: 5px; padding: 2px 9px; font-size: 12.5px; background: transparent; color: var(--ink2); }
  .seg button[aria-pressed='true'] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(27,29,58,.15); }
  .seg button:hover { border-color: transparent; color: var(--ink); }

  .stats { font-size: 12px; color: var(--ink2); margin: -2px 0 2px; }
  .links { display: flex; gap: 8px; margin-top: 10px; }
  .links a { flex: 1; text-align: center; text-decoration: none; padding: 6px 0; border-radius: 8px; background: var(--ground); color: var(--ink); font-size: 13px; }
  .links a:hover { background: var(--rule); }
</style>
</head>
<body>
<div class="band"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M45.01 21.65 43.44 43.58 20.9 44.2 19.61 23ZM21.07 48.29 47.25 47.5Q48.09 47.45 48.74 47.34Q49.38 47.22 49.38 46.44Q49.38 45.99 48.99 45.32Q48.6 44.64 47.81 43.64L49.66 21.32Q49.72 21.09 49.86 20.79Q50 20.48 50 20.08Q50 19.3 49.05 18.46Q48.09 17.62 46.8 17.62H46.47L19.21 19.02Q16.02 17.62 15.01 17.62Q14 17.62 14 18.51Q14 19.02 14.39 19.69Q14.73 20.36 14.95 21.35Q15.18 22.33 15.23 23.17L16.52 45.49Q16.58 45.77 16.58 46.07Q16.58 46.38 16.58 46.66Q16.58 47.39 16.52 47.93Q16.47 48.46 16.36 49.07Q16.36 49.13 16.33 49.21Q16.3 49.3 16.3 49.47Q16.3 50.53 17.25 51.15Q18.21 51.77 19.1 52.1L20 52.38Q21.23 52.38 21.23 50.64V50.36Z" fill="#fbf1de"/><g transform="rotate(4 32 34)"><path d="M27.2 4h4.6l-1.0999999999999999 56h-2.4z" fill="#1c1a1a"/><path d="M27.2 4h4.6l-.15 9h-4.3z" fill="#e9b44c"/></g><g transform="rotate(11 32 34)"><path d="M32.7 4h4.6l-1.0999999999999999 56h-2.4z" fill="#1c1a1a"/><path d="M32.7 4h4.6l-.15 9h-4.3z" fill="#e9b44c"/></g></svg><div id="counts" style="display:contents"></div></div>
<div class="wrap">

  <div class="group">
    <h3>Lookup</h3>
    <div class="row"><span>Show card</span>
      <div class="seg" data-setting="hoverMode"><button data-v="hover">hover</button><button data-v="alt" title="Only while holding Option (Alt)">⌥ Option</button><button data-v="off">off</button></div>
    </div>
    <div class="row" id="siteLine" hidden><span>Lookup on <b class="hostname"></b></span><label class="sw"><input type="checkbox" id="siteOn"><i></i></label></div>
    <div class="row"><span>Pinyin <kbd>P</kbd></span><label class="sw"><input type="checkbox" data-setting="pinyin"><i></i></label></div>
    <div class="row"><span>Card size</span>
      <div class="seg" data-setting="cardSize"><button data-v="normal">normal</button><button data-v="large">large</button></div>
    </div>
    <div class="row"><span>Color words on pages</span><label class="sw"><input type="checkbox" data-setting="pageColors"><i></i></label></div>
    <div class="row" id="colorLine" hidden><span>Colors on <b class="hostname"></b><span class="sub" id="colorKey"></span></span><label class="sw"><input type="checkbox" id="colorsOn"><i></i></label></div>
    <div class="stats" id="pageStats"></div>
    <div class="row"><span>Stamp sounds</span><label class="sw"><input type="checkbox" data-setting="sounds"><i></i></label></div>
  </div>

  <div class="group">
    <h3>YouTube</h3>
    <div class="row"><span>Chinese Brain subtitles</span><label class="sw"><input type="checkbox" data-setting="ytEnabled"><i></i></label></div>
    <div class="row"><span>English line <kbd>X</kbd></span>
      <div class="seg" data-setting="translation"><button data-v="show">show</button><button data-v="blur">blur</button><button data-v="hide">hide</button></div>
    </div>
    <div class="row"><span>Pause on hover</span><label class="sw"><input type="checkbox" data-setting="pauseOnHover"><i></i></label></div>
    <div class="row"><span>Subtitle band</span>
      <div class="seg" data-setting="subStyle"><button data-v="light">light</button><button data-v="dark">dark</button></div>
    </div>
  </div>

  <div class="links"><a href="vocab.html" target="_blank">Word list &amp; export</a><a href="options.html" target="_blank">All settings</a></div>
</div>
<script src="action.js"></script>
</body>
</html>
